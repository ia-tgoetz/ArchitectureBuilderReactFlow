name: Build module and publish to Ignition repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-module
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare signing files
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          CHAIN_B64: ${{ secrets.SIGNING_CHAIN_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          CERT_ALIAS: ${{ secrets.SIGNING_CERT_ALIAS }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/module-keystore.pfx"
          echo "$CHAIN_B64" | base64 -d > "$RUNNER_TEMP/certificates.p7b"

          mkdir -p ~/.gradle
          {
            echo "ignition.signing.keystoreFile=$RUNNER_TEMP/module-keystore.pfx"
            echo "ignition.signing.keystorePassword=$KEYSTORE_PASSWORD"
            echo "ignition.signing.certFile=$RUNNER_TEMP/certificates.p7b"
            echo "ignition.signing.certAlias=$CERT_ALIAS"
            echo "ignition.signing.certPassword=$CERT_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: Build module
        run: ./gradlew build --no-daemon

      - name: Checkout Ignition repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ARCH_BUILDER_REPO }}
          path: ignition-repo
          token: ${{ secrets.IGNITION_REPO_PAT }}

      - name: Copy module into Ignition repo
        run: |
          mkdir -p ignition-repo/modules
          find . -path ./ignition-repo -prune -o -name '*.modl' ! -name '*.unsigned.modl' -print \
            -exec cp {} ignition-repo/module-init/ \;

      - name: Commit and push
        working-directory: ignition-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module-init/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update module build from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git pull --rebase
            git push
          fi
